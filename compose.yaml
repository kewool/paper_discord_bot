name: paper-league

services:
  paper-league:
    image: paper-league:local
    build:
      context: .
    init: true
    restart: unless-stopped
    stop_grace_period: 60s
    env_file:
      - ${PAPER_ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      DEMO_MODE: "false"
      HOST: 0.0.0.0
      PORT: "3000"
      DATA_DIR: /app/data
      CODEX_HOME: /home/node/.codex
      TRUST_PROXY_HOPS: "1"
    expose:
      - "3000"
    volumes:
      - data:/app/data
      - codex-auth:/home/node/.codex
    networks:
      - default
      - proxy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  data:
  codex-auth:

networks:
  proxy:
    external: true
    name: ${NGINX_NETWORK:-proxy}
